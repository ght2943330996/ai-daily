name: AI日报定时推送

on:
  schedule:
    # 每天 07:47（中国时区 UTC+8）——GitHub Actions 的 cron 按 UTC 计算，23:47 UTC = 次日 07:47 +8。
    # 刻意避开整点：GitHub 的 schedule 在整点（尤其 00:00 UTC）排队高峰，可能延迟数小时甚至漏跑。
    # 发送成功后会更新 last_sent.txt 标记，由 catchup.yml 在 10:17 兜底补发。
    - cron: '47 23 * * *'
  workflow_dispatch: {}   # 支持手动触发测试

permissions:
  contents: write   # 发送成功后把 last_sent.txt 提交回仓库，供 catchup.yml 判断

jobs:
  send-daily:
    name: 推送 AI日报 + 工具速报
    runs-on: macos-latest
    env:
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      # 23:47 UTC 触发时 UTC 日期比北京时间落后一天，必须用北京时区取"今天"
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行推送脚本（失败自动重试 3 次）
        shell: bash
        run: |
          # 定时任务偶发网络抖动，发送失败重试，最多 3 次、间隔 60 秒
          for attempt in 1 2 3; do
            if bash run.sh; then
              exit 0
            fi
            echo "第 $attempt 次运行失败，60 秒后重试..."
            sleep 60
          done
          echo "连续 3 次失败，请查看上方日志" >&2
          exit 1

      # 只有上一步发送成功才会执行到这里；发送失败时标记不更新，
      # catchup.yml 会在 10:17 检测到"今天未发送"并自动补发。
      - name: 写入发送标记
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$(date +%F)" > last_sent.txt
          git add last_sent.txt
          git commit -m "标记 $(date +%F) 日报已发送"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
